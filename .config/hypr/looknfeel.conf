# Change the default Omarchy look'n'feel

# https://wiki.hyprland.org/Configuring/Variables/#general

general {
    # No gaps between windows
    gaps_in = 5
    gaps_out = 5, 10, 10, 10

    border_size = 2
    col.active_border = rgba(88c0d0ff) rgba(88c0d0ff) 45deg
    col.inactive_border = rgba(595959aa)

    layout = dwindle

    # Use master layout instead of dwindle
    # layout = master
}

source = ~/.config/themes/current/hyprland.conf

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 6
	  dim_special = 0.0
    active_opacity = 1.0
    inactive_opacity = 0.85
    
    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        vibrancy = 0.1696
        enabled = true
        size = 8
        passes = 1
        new_optimizations = true
        xray = false
		    contrast = 0.7
		    brightness = 0.5
		    noise = 0.1
		    vibrancy_darkness = 0.0
		    special = true
    }
}

group {
    col.border_active = rgba(2E3134FF)
    col.border_inactive = rgba(101010FF)
    # auto_group = true

    groupbar {
        rounding = 6
        font_family = JetBrainsMono Nerd Font Mono
        font_size = 10
        height = 25
        text_offset = -1
        indicator_gap = 1
        indicator_height = 1
        col.active = rgba(6E7378ff)
        col.inactive = rgba(191919FF)
        text_color = rgba(e7e9eaff)
        text_color_inactive = rgba(6E7378ff)
        gaps_in = 0
        gaps_out = 0
        font_weight_active = bold
        font_weight_inactive = bold
    }
}
